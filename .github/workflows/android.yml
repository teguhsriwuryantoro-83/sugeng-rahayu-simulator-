name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          java -version
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_EXIT=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_EXIT" -ne 0 ]; then
            echo "::warning::SDK license command exited $LICENSE_EXIT; inspecting installed packages"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz
          cp templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import
      - name: Export APK
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/sugeng-rahayu.apk
      - name: Verify APK
        run: test -s build/sugeng-rahayu.apk && unzip -t build/sugeng-rahayu.apk | tail -1
      - name: Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          echo "PATH=$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -o -name android.jar 2>/dev/null | head -50 || true
          find build -maxdepth 2 -type f 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: sugeng-rahayu-apk
          path: build/sugeng-rahayu.apk
